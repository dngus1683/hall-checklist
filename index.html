<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>웨딩홀 투어 체크리스트</title>
    <script src="https://unpkg.com/react@17/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@17/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/babel-standalone@6/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background-color: #f9fafb; }
        .input-field { width: 100%; padding: 0.6rem; border-radius: 0.375rem; border: 1px solid #d1d5db; margin-top: 0.25rem; font-size: 15px; background-color: #ffffff;}
        .input-field:focus { outline: none; border-color: #ec4899; box-shadow: 0 0 0 1px #ec4899; }
        .section-title { color: #db2777; font-weight: 700; border-bottom: 2px solid #fce7f3; padding-bottom: 0.5rem; margin-bottom: 1rem; margin-top: 1.5rem; display: flex; align-items: center; gap: 0.5rem; }
        .label-text { display: block; font-size: 0.875rem; font-weight: 600; color: #4b5563; }
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0.75rem; }
    </style>
</head>
<body>
    <div id="root"></div>
    <script type="text/babel">
        const { useState, useEffect } = React;

        const initialHallData = {
            id: null,
            name: '',
            tourDate: '',
            consultant: '',
            
            // 2. 예식 스케쥴 (추가됨)
            receptionTime: '',
            ceremonyTime: '',
            photoTime: '',
            mealTimeSlot: '',

            // 3. 위치 및 교통
            location: '',
            subway: '',
            busAndShuttle: '',
            parkingCapacity: '',
            parkingTime: '',
            parkingFee: '',
            atmAndElevator: '',

            // 4. 홀 컨디션
            hallType: '', 
            atmosphere: '', 
            ceilingHeight: '',
            virginRoad: '', 
            seatCount: '',
            ceremonyInterval: '', 
            screenAndSound: '',
            mixedGuests: '', 

            // 5. 신부대기실 & 부대시설
            bridalRoomSpace: '',
            bridalRoomLight: '',
            bridalRoomToilet: '', 
            bridalRoomPath: '', 
            lobbySpace: '',
            paebaek: '', 

            // 6. 연회장 및 식사
            foodType: '', 
            diningRoomFloor: '', 
            diningRoomCapacity: '',
            mealTime: '', 
            drinkIncluded: '', 
            kidsMeal: '', 

            // 7. 견적 (시간대별 다중 기록 배열로 변경)
            estimates: [
                {
                    id: Date.now(),
                    timeSlot: '', // 예: 토요일 11:00
                    guarantee: '',
                    rentalFeeDiscount: '',
                    foodPriceDiscount: '',
                    additionalCost: '', // 추가 비용 신설
                    isExpanded: true
                }
            ],
            
            deposit: '', 
            cancelPolicy: '', 
            perks: '', 
            
            // 8. 총평
            rating: 3,
            notes: ''
        };

        function App() {
            const [halls, setHalls] = useState([]);
            const [currentView, setCurrentView] = useState('list');
            const [activeHall, setActiveHall] = useState({ ...initialHallData });

            useEffect(() => {
                const savedData = localStorage.getItem('weddingHalls_v3'); // 버전명 업데이트
                if (savedData) {
                    setHalls(JSON.parse(savedData));
                } else {
                    // 구버전(v2) 데이터 마이그레이션 확인
                    const oldData = localStorage.getItem('weddingHalls_v2');
                    if (oldData) {
                        const parsedOld = JSON.parse(oldData).map(hall => {
                            if (!hall.estimates) {
                                return {
                                    ...hall,
                                    estimates: [{
                                        id: Date.now() + Math.random(),
                                        timeSlot: '기본 견적',
                                        guarantee: hall.guarantee || '',
                                        rentalFeeDiscount: hall.rentalFeeDiscount || '',
                                        foodPriceDiscount: hall.foodPriceDiscount || '',
                                        additionalCost: '',
                                        isExpanded: false
                                    }]
                                }
                            }
                            return hall;
                        });
                        setHalls(parsedOld);
                        saveToLocal(parsedOld);
                    }
                }
            }, []);

            const saveToLocal = (data) => {
                localStorage.setItem('weddingHalls_v3', JSON.stringify(data));
            };

            const handleAddHall = () => {
                setActiveHall({ 
                    ...initialHallData, 
                    id: Date.now(),
                    estimates: [{
                        id: Date.now(),
                        timeSlot: '',
                        guarantee: '',
                        rentalFeeDiscount: '',
                        foodPriceDiscount: '',
                        additionalCost: '',
                        isExpanded: true
                    }] 
                });
                setCurrentView('detail');
            };

            const handleEditHall = (hall) => {
                // 이전 데이터 호환성 보장
                let editHall = { ...hall };
                if (!editHall.estimates || editHall.estimates.length === 0) {
                    editHall.estimates = [{
                        id: Date.now(),
                        timeSlot: '기본 견적',
                        guarantee: editHall.guarantee || '',
                        rentalFeeDiscount: editHall.rentalFeeDiscount || '',
                        foodPriceDiscount: editHall.foodPriceDiscount || '',
                        additionalCost: '',
                        isExpanded: true
                    }];
                }
                setActiveHall(editHall);
                setCurrentView('detail');
            };

            const handleDelete = (id) => {
                if(window.confirm('이 웨딩홀의 모든 기록을 삭제하시겠습니까?')) {
                    const updatedHalls = halls.filter(h => h.id !== id);
                    setHalls(updatedHalls);
                    saveToLocal(updatedHalls);
                }
            };

            const handleChange = (e) => {
                const { name, value } = e.target;
                setActiveHall(prev => ({
                    ...prev,
                    [name]: value
                }));
            };

            // 시간대별 견적 관련 핸들러들
            const handleAddEstimate = () => {
                setActiveHall(prev => ({
                    ...prev,
                    estimates: [...prev.estimates, {
                        id: Date.now(),
                        timeSlot: '',
                        guarantee: '',
                        rentalFeeDiscount: '',
                        foodPriceDiscount: '',
                        additionalCost: '',
                        isExpanded: true
                    }]
                }));
            };

            const handleEstimateChange = (id, field, value) => {
                setActiveHall(prev => ({
                    ...prev,
                    estimates: prev.estimates.map(est => 
                        est.id === id ? { ...est, [field]: value } : est
                    )
                }));
            };

            const toggleEstimate = (id) => {
                setActiveHall(prev => ({
                    ...prev,
                    estimates: prev.estimates.map(est => 
                        est.id === id ? { ...est, isExpanded: !est.isExpanded } : est
                    )
                }));
            };

            const removeEstimate = (id) => {
                if(window.confirm('이 견적을 삭제하시겠습니까?')) {
                    setActiveHall(prev => ({
                        ...prev,
                        estimates: prev.estimates.filter(est => est.id !== id)
                    }));
                }
            };

            const handleSave = () => {
                if(!activeHall.name) {
                    alert('웨딩홀 이름을 필수로 입력해주세요.');
                    return;
                }
                
                let updatedHalls;
                const exists = halls.find(h => h.id === activeHall.id);
                if (exists) {
                    updatedHalls = halls.map(h => h.id === activeHall.id ? activeHall : h);
                } else {
                    updatedHalls = [...halls, activeHall];
                }
                
                setHalls(updatedHalls);
                saveToLocal(updatedHalls);
                setCurrentView('list');
                window.scrollTo(0, 0);
            };

            const formatMoney = (num) => {
                return num ? num.toLocaleString() + '원' : '0원';
            };

            if (currentView === 'list') {
                return (
                    <div className="max-w-md mx-auto min-h-screen bg-gray-50 pb-24">
                        <header className="bg-pink-500 text-white p-4 sticky top-0 z-10 shadow-md">
                            <h1 className="text-xl font-bold text-center">웨딩홀 투어 마스터 💍</h1>
                        </header>
                        
                        <div className="p-4 space-y-4">
                            {halls.length === 0 ? (
                                <div className="text-center text-gray-500 py-16 px-4 bg-white rounded-xl shadow-sm border border-gray-100">
                                    <span className="text-4xl block mb-3">📝</span>
                                    <p className="font-semibold text-lg text-gray-700">기록된 웨딩홀이 없습니다.</p>
                                    <p className="text-sm mt-1">우측 하단 버튼을 눌러 새 투어를 기록해보세요!</p>
                                </div>
                            ) : (
                                halls.map(hall => {
                                    const estimates = hall.estimates || [];
                                    
                                    return (
                                        <div key={hall.id} className="bg-white p-5 rounded-xl shadow-sm border border-gray-200 relative overflow-hidden">
                                            <div className="absolute top-0 left-0 w-1 h-full bg-pink-400"></div>
                                            <div className="flex justify-between items-start mb-3">
                                                <div>
                                                    <h2 className="text-lg font-bold text-gray-800">{hall.name}</h2>
                                                    <p className="text-xs text-gray-500">📅 {hall.tourDate || '날짜 미지정'}</p>
                                                </div>
                                                <div className="bg-pink-50 text-pink-600 px-2 py-1 rounded text-sm font-bold flex items-center">
                                                    ⭐ {hall.rating}
                                                </div>
                                            </div>
                                            <div className="bg-gray-50 p-3 rounded-lg mb-4 text-sm space-y-2">
                                                <div className="text-xs font-bold text-gray-500 border-b border-gray-200 pb-1">시간대별 예상 견적 요약</div>
                                                {estimates.map((est, idx) => {
                                                    const g = Number(est.guarantee) || 0;
                                                    const f = Number(est.foodPriceDiscount) || 0;
                                                    const r = Number(est.rentalFeeDiscount) || 0;
                                                    const a = Number(est.additionalCost) || 0;
                                                    const total = (g * f) + r + a;
                                                    return (
                                                        <div key={est.id || idx} className="flex justify-between items-center">
                                                            <span className="text-gray-600 truncate mr-2">{est.timeSlot || `견적 ${idx + 1}`}</span>
                                                            <span className="font-semibold text-pink-600 shrink-0">{formatMoney(total)}</span>
                                                        </div>
                                                    )
                                                })}
                                            </div>
                                            <div className="flex space-x-2">
                                                <button onClick={() => handleEditHall(hall)} className="flex-1 bg-white border border-gray-300 text-gray-700 py-2 rounded-lg font-medium text-sm hover:bg-gray-50">상세 보기 및 수정</button>
                                                <button onClick={() => handleDelete(hall.id)} className="px-4 bg-white border border-red-200 text-red-500 py-2 rounded-lg font-medium text-sm hover:bg-red-50">삭제</button>
                                            </div>
                                        </div>
                                    )
                                })
                            )}
                        </div>

                        <button 
                            onClick={handleAddHall}
                            className="fixed bottom-6 right-6 w-14 h-14 bg-pink-500 text-white rounded-full shadow-xl text-3xl flex items-center justify-center hover:bg-pink-600 transition-transform active:scale-95"
                        >
                            +
                        </button>
                    </div>
                );
            }

            return (
                <div className="max-w-md mx-auto min-h-screen bg-white pb-10">
                    <header className="bg-pink-500 text-white p-4 sticky top-0 z-20 shadow-md flex justify-between items-center">
                        <button onClick={() => { setCurrentView('list'); window.scrollTo(0,0); }} className="font-bold p-1">← 취소</button>
                        <h1 className="text-lg font-bold truncate px-2">{activeHall.name ? activeHall.name : '새 투어 기록'}</h1>
                        <button onClick={handleSave} className="font-bold p-1 bg-white text-pink-600 px-3 rounded shadow-sm text-sm">저장</button>
                    </header>

                    <div className="p-4 space-y-6">
                        {/* 1. 기본 정보 */}
                        <section>
                            <h3 className="section-title">📌 1. 기본 정보</h3>
                            <div className="space-y-3">
                                <div>
                                    <label className="label-text">웨딩홀 이름 *</label>
                                    <input type="text" name="name" value={activeHall.name} onChange={handleChange} className="input-field" placeholder="예: 더채플앳논현" />
                                </div>
                                <div className="grid-2">
                                    <div>
                                        <label className="label-text">투어 날짜</label>
                                        <input type="date" name="tourDate" value={activeHall.tourDate} onChange={handleChange} className="input-field" />
                                    </div>
                                    <div>
                                        <label className="label-text">상담자 이름</label>
                                        <input type="text" name="consultant" value={activeHall.consultant} onChange={handleChange} className="input-field" placeholder="예: 김상담 실장" />
                                    </div>
                                </div>
                            </div>
                        </section>

                        {/* 2. 예식 스케쥴 (신규) */}
                        <section>
                            <h3 className="section-title">⏱️ 2. 예식 스케쥴</h3>
                            <div className="space-y-3 bg-gray-50 p-4 rounded-xl border border-gray-100">
                                <div className="grid-2">
                                    <div>
                                        <label className="label-text">하객 맞이</label>
                                        <input type="text" name="receptionTime" value={activeHall.receptionTime} onChange={handleChange} className="input-field" placeholder="예: 10:00 ~ 11:00" />
                                    </div>
                                    <div>
                                        <label className="label-text">예식 진행</label>
                                        <input type="text" name="ceremonyTime" value={activeHall.ceremonyTime} onChange={handleChange} className="input-field" placeholder="예: 11:00 ~ 11:40" />
                                    </div>
                                </div>
                                <div className="grid-2">
                                    <div>
                                        <label className="label-text">원판 사진 촬영</label>
                                        <input type="text" name="photoTime" value={activeHall.photoTime} onChange={handleChange} className="input-field" placeholder="예: 11:40 ~ 12:10" />
                                    </div>
                                    <div>
                                        <label className="label-text">식사 시간</label>
                                        <input type="text" name="mealTimeSlot" value={activeHall.mealTimeSlot} onChange={handleChange} className="input-field" placeholder="예: 10:30 ~ 12:30" />
                                    </div>
                                </div>
                            </div>
                        </section>

                        {/* 3. 교통 및 주차 */}
                        <section>
                            <h3 className="section-title">🚗 3. 위치 및 주차</h3>
                            <div className="space-y-3">
                                <div>
                                    <label className="label-text">대중교통 (지하철)</label>
                                    <input type="text" name="subway" value={activeHall.subway} onChange={handleChange} className="input-field" placeholder="예: 9호선 언주역 도보 3분" />
                                </div>
                                <div>
                                    <label className="label-text">셔틀버스 및 버스</label>
                                    <input type="text" name="busAndShuttle" value={activeHall.busAndShuttle} onChange={handleChange} className="input-field" placeholder="예: 15분 간격 셔틀 운행" />
                                </div>
                                <div className="grid-2">
                                    <div>
                                        <label className="label-text">주차 대수</label>
                                        <input type="text" name="parkingCapacity" value={activeHall.parkingCapacity} onChange={handleChange} className="input-field" placeholder="예: 동시 500대" />
                                    </div>
                                    <div>
                                        <label className="label-text">무료 주차 시간</label>
                                        <input type="text" name="parkingTime" value={activeHall.parkingTime} onChange={handleChange} className="input-field" placeholder="예: 하객 2시간" />
                                    </div>
                                </div>
                                <div>
                                    <label className="label-text">혼주 발렛 / ATM / 엘리베이터 수</label>
                                    <input type="text" name="atmAndElevator" value={activeHall.atmAndElevator} onChange={handleChange} className="input-field" placeholder="예: 혼주 2대 발렛, 엘베 4대, 1층 ATM" />
                                </div>
                            </div>
                        </section>

                        {/* 4. 홀 컨디션 */}
                        <section>
                            <h3 className="section-title">✨ 4. 홀 컨디션</h3>
                            <div className="space-y-3">
                                <div className="grid-2">
                                    <div>
                                        <label className="label-text">예식 형태</label>
                                        <input type="text" name="hallType" value={activeHall.hallType} onChange={handleChange} className="input-field" placeholder="예: 단독홀, 동시예식" />
                                    </div>
                                    <div>
                                        <label className="label-text">홀 분위기</label>
                                        <input type="text" name="atmosphere" value={activeHall.atmosphere} onChange={handleChange} className="input-field" placeholder="예: 어두운 컨벤션" />
                                    </div>
                                </div>
                                <div className="grid-2">
                                    <div>
                                        <label className="label-text">천장 높이(천고)</label>
                                        <input type="text" name="ceilingHeight" value={activeHall.ceilingHeight} onChange={handleChange} className="input-field" placeholder="예: 7m (높음)" />
                                    </div>
                                    <div>
                                        <label className="label-text">예식 간격</label>
                                        <input type="text" name="ceremonyInterval" value={activeHall.ceremonyInterval} onChange={handleChange} className="input-field" placeholder="예: 90분" />
                                    </div>
                                </div>
                                <div>
                                    <label className="label-text">버진로드 (단차/길이)</label>
                                    <input type="text" name="virginRoad" value={activeHall.virginRoad} onChange={handleChange} className="input-field" placeholder="예: 화이트톤, 단차 있음, 김" />
                                </div>
                                <div>
                                    <label className="label-text">좌석 수 및 하객 섞임 여부</label>
                                    <input type="text" name="mixedGuests" value={activeHall.mixedGuests} onChange={handleChange} className="input-field" placeholder="예: 250석, 앞뒤 타임 섞임 주의" />
                                </div>
                            </div>
                        </section>

                        {/* 5. 신부대기실 및 부대시설 */}
                        <section>
                            <h3 className="section-title">👗 5. 신부대기실 & 부대시설</h3>
                            <div className="space-y-3">
                                <div>
                                    <label className="label-text">신부대기실 (넓이/채광/전용 화장실)</label>
                                    <input type="text" name="bridalRoomSpace" value={activeHall.bridalRoomSpace} onChange={handleChange} className="input-field" placeholder="예: 넓고 채광 좋음, 화장실 O" />
                                </div>
                                <div>
                                    <label className="label-text">대기실 -> 홀 입장 동선</label>
                                    <input type="text" name="bridalRoomPath" value={activeHall.bridalRoomPath} onChange={handleChange} className="input-field" placeholder="예: 비밀문 통해 버진로드 바로 연결" />
                                </div>
                                <div>
                                    <label className="label-text">로비 및 축의대 (넓이/혼잡도)</label>
                                    <input type="text" name="lobbySpace" value={activeHall.lobbySpace} onChange={handleChange} className="input-field" placeholder="예: 로비가 다소 좁음" />
                                </div>
                                <div>
                                    <label className="label-text">폐백실 여부 / 수모비</label>
                                    <input type="text" name="paebaek" value={activeHall.paebaek} onChange={handleChange} className="input-field" placeholder="예: 진행안함 / 진행시 수모비 10만" />
                                </div>
                            </div>
                        </section>

                        {/* 6. 식사 */}
                        <section>
                            <h3 className="section-title">🍽️ 6. 식사 및 연회장</h3>
                            <div className="space-y-3">
                                <div className="grid-2">
                                    <div>
                                        <label className="label-text">식사 종류</label>
                                        <input type="text" name="foodType" value={activeHall.foodType} onChange={handleChange} className="input-field" placeholder="예: 뷔페 140여종" />
                                    </div>
                                    <div>
                                        <label className="label-text">음주류 포함 여부</label>
                                        <input type="text" name="drinkIncluded" value={activeHall.drinkIncluded} onChange={handleChange} className="input-field" placeholder="예: 생맥/소주 포함" />
                                    </div>
                                </div>
                                <div>
                                    <label className="label-text">연회장 동선 및 크기</label>
                                    <input type="text" name="diningRoomFloor" value={activeHall.diningRoomFloor} onChange={handleChange} className="input-field" placeholder="예: 한 층 아래 계단 이동, 700석" />
                                </div>
                                <div>
                                    <label className="label-text">이용 시간 및 혼주석 유무</label>
                                    <input type="text" name="mealTime" value={activeHall.mealTime} onChange={handleChange} className="input-field" placeholder="예: 예식 30분전부터 2시간, 혼주룸 O" />
                                </div>
                            </div>
                        </section>

                        {/* 7. 견적(시간대별 다중 견적 및 자동계산) */}
                        <section>
                            <h3 className="section-title">💰 7. 견적 및 혜택 (시간대별)</h3>
                            
                            {activeHall.estimates.map((est, index) => {
                                const g = Number(est.guarantee) || 0;
                                const f = Number(est.foodPriceDiscount) || 0;
                                const r = Number(est.rentalFeeDiscount) || 0;
                                const a = Number(est.additionalCost) || 0;
                                const total = (g * f) + r + a;

                                return (
                                    <div key={est.id} className="bg-pink-50 rounded-xl border border-pink-200 mb-4 shadow-sm overflow-hidden transition-all">
                                        {/* 아코디언 헤더 */}
                                        <div 
                                            className="p-4 flex justify-between items-center cursor-pointer hover:bg-pink-100"
                                            onClick={() => toggleEstimate(est.id)}
                                        >
                                            <h4 className="font-bold text-pink-700">
                                                {est.isExpanded 
                                                    ? `🧾 견적 ${index + 1}` 
                                                    : `🧾 ${est.timeSlot || `견적 ${index + 1}`} - 총 ${formatMoney(total)}`
                                                }
                                            </h4>
                                            <span className="text-pink-500 font-bold text-sm">
                                                {est.isExpanded ? '접기 ▲' : '펼치기 ▼'}
                                            </span>
                                        </div>

                                        {/* 아코디언 바디 */}
                                        {est.isExpanded && (
                                            <div className="p-4 pt-0 space-y-4">
                                                <div className="bg-white p-3 rounded-lg border border-pink-100 shadow-sm">
                                                    <label className="label-text text-pink-600 mb-1">견적 시간대 및 기준</label>
                                                    <input type="text" value={est.timeSlot} onChange={(e) => handleEstimateChange(est.id, 'timeSlot', e.target.value)} className="input-field bg-gray-50 border-gray-200" placeholder="예: 토요일 11:00 (골든타임)" />
                                                    
                                                    <div className="grid-2 mt-2">
                                                        <div>
                                                            <label className="label-text">보증 인원 (명)</label>
                                                            <input type="number" value={est.guarantee} onChange={(e) => handleEstimateChange(est.id, 'guarantee', e.target.value)} className="input-field font-bold" placeholder="예: 250" />
                                                        </div>
                                                        <div>
                                                            <label className="label-text text-gray-500">추가 비용 (원)</label>
                                                            <input type="number" value={est.additionalCost} onChange={(e) => handleEstimateChange(est.id, 'additionalCost', e.target.value)} className="input-field" placeholder="필수 연출료 등" />
                                                        </div>
                                                    </div>
                                                </div>

                                                <div className="grid-2">
                                                    <div>
                                                        <label className="label-text text-pink-600">대관료 (할인가) *</label>
                                                        <input type="number" value={est.rentalFeeDiscount} onChange={(e) => handleEstimateChange(est.id, 'rentalFeeDiscount', e.target.value)} className="input-field border-pink-300" placeholder="숫자만" />
                                                    </div>
                                                    <div>
                                                        <label className="label-text text-pink-600">식대 (할인가) *</label>
                                                        <input type="number" value={est.foodPriceDiscount} onChange={(e) => handleEstimateChange(est.id, 'foodPriceDiscount', e.target.value)} className="input-field border-pink-300" placeholder="숫자만" />
                                                    </div>
                                                </div>

                                                {/* 자동 계산 결과 요약 */}
                                                <div className="bg-white p-3 rounded-lg border border-pink-100">
                                                    <div className="flex justify-between items-center text-sm text-gray-600 mb-1">
                                                        <span>식대 총합 ({est.guarantee || 0}명)</span>
                                                        <span>{formatMoney(g * f)}</span>
                                                    </div>
                                                    <div className="flex justify-between items-center text-sm text-gray-600 mb-1">
                                                        <span>대관료</span>
                                                        <span>+ {formatMoney(r)}</span>
                                                    </div>
                                                    <div className="flex justify-between items-center text-sm text-gray-600">
                                                        <span>추가 비용</span>
                                                        <span>+ {formatMoney(a)}</span>
                                                    </div>
                                                    <div className="flex justify-between items-center pt-2 mt-2 border-t border-gray-100 text-base font-bold text-pink-700">
                                                        <span>총 예상 견적</span>
                                                        <span>{formatMoney(total)}</span>
                                                    </div>
                                                </div>
                                                
                                                {activeHall.estimates.length > 1 && (
                                                    <button onClick={() => removeEstimate(est.id)} className="w-full text-red-400 text-sm mt-1 font-bold py-2 border border-red-100 rounded bg-white hover:bg-red-50">
                                                        이 견적 삭제
                                                    </button>
                                                )}
                                            </div>
                                        )}
                                    </div>
                                );
                            })}

                            <button onClick={handleAddEstimate} className="w-full bg-white border-2 border-dashed border-pink-300 text-pink-500 font-bold py-3 rounded-xl mb-6 hover:bg-pink-50 transition-colors">
                                + 다른 시간대 견적 추가하기
                            </button>
                            
                            <div className="space-y-4">
                                <div>
                                    <label className="label-text">당일 계약 혜택 및 서비스 (플라워샤워 등)</label>
                                    <textarea name="perks" value={activeHall.perks} onChange={handleChange} className="input-field" rows="2" placeholder="예: 전문 사회자 무료, 식대 2000원 추가 할인"></textarea>
                                </div>
                                <div className="grid-2">
                                    <div>
                                        <label className="label-text">계약금</label>
                                        <input type="text" name="deposit" value={activeHall.deposit} onChange={handleChange} className="input-field" placeholder="예: 200만원" />
                                    </div>
                                    <div>
                                        <label className="label-text">취소 위약금 규정</label>
                                        <input type="text" name="cancelPolicy" value={activeHall.cancelPolicy} onChange={handleChange} className="input-field" placeholder="예: 150일 전 전액 환불" />
                                    </div>
                                </div>
                            </div>
                        </section>

                        {/* 8. 총평 */}
                        <section className="pb-10">
                            <h3 className="section-title">📝 8. 최종 평가</h3>
                            <div className="space-y-3">
                                <div>
                                    <label className="label-text">내 마음속 평점 (1~5)</label>
                                    <select name="rating" value={activeHall.rating} onChange={handleChange} className="input-field font-bold text-lg text-center">
                                        <option value="5">⭐⭐⭐⭐⭐ (최고! 계약하고 싶음)</option>
                                        <option value="4">⭐⭐⭐⭐ (좋음! 후보 등록)</option>
                                        <option value="3">⭐⭐⭐ (무난함)</option>
                                        <option value="2">⭐⭐ (아쉬움)</option>
                                        <option value="1">⭐ (별로임)</option>
                                    </select>
                                </div>
                                <div>
                                    <label className="label-text">장점 / 단점 / 개인적인 메모</label>
                                    <textarea name="notes" value={activeHall.notes} onChange={handleChange} className="input-field" rows="4" placeholder="예: 홀 분위기는 완벽했으나, 주차장이 좁아서 하객들 컴플레인이 걱정됨. 밥은 평이 좋음."></textarea>
                                </div>
                            </div>
                        </section>
                    </div>
                </div>
            );
        }

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
