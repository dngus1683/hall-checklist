<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>웨딩홀 투어 체크리스트</title>
    <style>
        :root {
            --primary: #ff6b81;
            --bg: #f8f9fa;
            --card-bg: #ffffff;
            --border: #e1e8ed;
            --text-main: #2d3436;
            --text-sub: #636e72;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text-main);
            margin: 0;
            padding: 0;
            padding-bottom: 80px;
        }
        header {
            background-color: var(--primary);
            color: white;
            padding: 20px;
            text-align: center;
            font-size: 1.2rem;
            font-weight: bold;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        .container {
            padding: 15px;
        }
        .hall-card {
            background-color: var(--card-bg);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            border: 1px solid var(--border);
        }
        .hall-title {
            width: 100%;
            font-size: 1.4rem;
            font-weight: bold;
            border: none;
            border-bottom: 2px solid var(--primary);
            padding: 5px 0;
            margin-bottom: 15px;
            outline: none;
            color: var(--text-main);
            background: transparent;
        }
        .section-title {
            font-size: 1.1rem;
            color: var(--primary);
            margin: 20px 0 10px 0;
            border-bottom: 1px solid var(--border);
            padding-bottom: 5px;
        }
        .input-group {
            margin-bottom: 12px;
            display: flex;
            flex-direction: column;
        }
        .input-group label {
            font-size: 0.9rem;
            color: var(--text-sub);
            margin-bottom: 4px;
        }
        .input-group input, .input-group select {
            padding: 10px;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 1rem;
            background-color: var(--bg);
            outline: none;
        }
        .input-group input:focus {
            border-color: var(--primary);
        }
        /* 견적 아코디언 스타일 */
        .estimate-item {
            background-color: var(--bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            margin-bottom: 10px;
            overflow: hidden;
        }
        .estimate-item summary {
            padding: 15px;
            font-weight: bold;
            background-color: #f1f2f6;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            list-style: none; /* 기본 화살표 제거 */
        }
        .estimate-item summary::webkit-details-marker {
            display: none;
        }
        .estimate-item summary .est-title {
            color: var(--primary);
        }
        .est-content {
            padding: 15px;
            border-top: 1px solid var(--border);
        }
        .total-box {
            background-color: #ffeaa7;
            padding: 15px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 1.1rem;
            text-align: center;
            margin-top: 10px;
        }
        .btn {
            display: inline-block;
            padding: 12px 15px;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: bold;
            text-align: center;
            cursor: pointer;
            width: 100%;
            margin-top: 10px;
        }
        .btn-primary { background-color: var(--primary); color: white; }
        .btn-outline { background-color: transparent; border: 1px solid var(--primary); color: var(--primary); }
        .btn-danger { background-color: #ff7675; color: white; margin-top: 20px;}
        .btn-small { width: auto; padding: 6px 10px; font-size: 0.8rem; background-color: #dfe6e9; color: #2d3436; margin:0;}
        
        #add-hall-btn {
            position: fixed;
            bottom: 20px;
            left: 20px;
            right: 20px;
            width: calc(100% - 40px);
            box-shadow: 0 4px 10px rgba(255, 107, 129, 0.4);
        }
    </style>
</head>
<body>

    <header>💍 웨딩홀 투어 체크리스트</header>

    <div class="container" id="app">
        <!-- 웨딩홀 카드가 렌더링될 영역 -->
    </div>

    <button id="add-hall-btn" class="btn btn-primary" onclick="addHall()">+ 새 웨딩홀 추가</button>

    <script>
        const STORAGE_KEY = 'weddingHalls_v3';
        let data = JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];

        // 데이터 저장
        function save() {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
        }

        // 고유 ID 생성기
        function generateId() {
            return Date.now().toString() + Math.floor(Math.random() * 1000).toString();
        }

        // 새 웨딩홀 데이터 추가
        function addHall() {
            const newHall = {
                id: generateId(),
                name: '',
                // 스케쥴
                sch_reception: '', sch_ceremony: '', sch_photo: '', sch_meal: '',
                // 기본정보
                location: '', parking: '', meal_type: '', vibe: '',
                // 견적 (배열 형태로 여러개 저장)
                estimates: [
                    { id: generateId(), time: '', guests: '', rental: '', meal: '', additional: '', total: 0 }
                ]
            };
            data.unshift(newHall); // 최신 항목을 위로
            save();
            render();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // 웨딩홀 삭제
        function deleteHall(hallId) {
            if(confirm('이 웨딩홀 기록을 삭제하시겠습니까?')) {
                data = data.filter(h => h.id !== hallId);
                save();
                render();
            }
        }

        // 견적 항목 추가
        function addEstimate(hallId) {
            const hall = data.find(h => h.id === hallId);
            hall.estimates.push({ id: generateId(), time: '', guests: '', rental: '', meal: '', additional: '', total: 0 });
            save();
            render(); // 렌더링 다시 수행
        }

        // 견적 항목 삭제
        function deleteEstimate(hallId, estId) {
            if(confirm('이 시간대의 견적을 삭제하시겠습니까?')) {
                const hall = data.find(h => h.id === hallId);
                hall.estimates = hall.estimates.filter(e => e.id !== estId);
                save();
                render();
            }
        }

        // 입력값 변경 시 데이터 바인딩 및 자동저장
        function updateData(hallId, field, value) {
            const hall = data.find(h => h.id === hallId);
            hall[field] = value;
            save();
        }

        // 견적 자동 계산 및 바인딩
        function calcEstimate(hallId, estId) {
            const hall = data.find(h => h.id === hallId);
            const est = hall.estimates.find(e => e.id === estId);

            // 화면의 인풋값 가져오기
            est.time = document.getElementById(`time-${estId}`).value;
            est.guests = Number(document.getElementById(`guests-${estId}`).value) || 0;
            est.rental = Number(document.getElementById(`rental-${estId}`).value) || 0;
            est.meal = Number(document.getElementById(`meal-${estId}`).value) || 0;
            est.additional = Number(document.getElementById(`add-${estId}`).value) || 0;

            // 계산 로직: 대관료 + (식대 * 보증인원) + 추가비용
            est.total = est.rental + (est.meal * est.guests) + est.additional;
            
            // 화면 텍스트 즉시 업데이트 (전체 리렌더링 없이)
            document.getElementById(`total-${estId}`).innerText = est.total.toLocaleString();
            
            let timeText = est.time ? est.time : '시간 미정';
            document.getElementById(`summary-text-${estId}`).innerText = `[${timeText}] 총 견적: ${est.total.toLocaleString()}원`;

            save();
        }

        // 화면 그리기
        function render() {
            const app = document.getElementById('app');
            app.innerHTML = ''; // 초기화

            if(data.length === 0) {
                app.innerHTML = `<div style="text-align:center; margin-top:50px; color:#b2bec3;">등록된 투어 기록이 없습니다.<br>아래 버튼을 눌러 추가해보세요!</div>`;
                return;
            }

            data.forEach(hall => {
                const card = document.createElement('div');
                card.className = 'hall-card';

                // 견적 리스트 HTML 생성
                let estimatesHtml = '';
                hall.estimates.forEach((est, index) => {
                    let timeText = est.time ? est.time : '시간 미정';
                    // 첫 번째 견적만 기본으로 열어두고 나머지는 접어둠
                    let openAttr = index === 0 ? 'open' : ''; 
                    estimatesHtml += `
                        <details class="estimate-item" ${openAttr}>
                            <summary>
                                <span class="est-title" id="summary-text-${est.id}">[${timeText}] 총 견적: ${est.total.toLocaleString()}원</span>
                                <button class="btn btn-small" onclick="deleteEstimate('${hall.id}', '${est.id}')">삭제</button>
                            </summary>
                            <div class="est-content">
                                <div class="input-group">
                                    <label>예식 시간/날짜</label>
                                    <input type="text" id="time-${est.id}" value="${est.time}" placeholder="예: 25년 10월 토 12:30" oninput="calcEstimate('${hall.id}', '${est.id}')">
                                </div>
                                <div style="display:flex; gap:10px;">
                                    <div class="input-group" style="flex:1;">
                                        <label>보증 인원 (명)</label>
                                        <input type="number" id="guests-${est.id}" value="${est.guests}" placeholder="0" oninput="calcEstimate('${hall.id}', '${est.id}')">
                                    </div>
                                    <div class="input-group" style="flex:1;">
                                        <label>식대 1인 (원)</label>
                                        <input type="number" id="meal-${est.id}" value="${est.meal}" placeholder="할인가" oninput="calcEstimate('${hall.id}', '${est.id}')">
                                    </div>
                                </div>
                                <div style="display:flex; gap:10px;">
                                    <div class="input-group" style="flex:1;">
                                        <label>대관료 (원)</label>
                                        <input type="number" id="rental-${est.id}" value="${est.rental}" placeholder="할인가" oninput="calcEstimate('${hall.id}', '${est.id}')">
                                    </div>
                                    <div class="input-group" style="flex:1;">
                                        <label>추가 비용 (원)</label>
                                        <input type="number" id="add-${est.id}" value="${est.additional}" placeholder="필수/옵션" oninput="calcEstimate('${hall.id}', '${est.id}')">
                                    </div>
                                </div>
                                <div class="total-box">
                                    최종: <span id="total-${est.id}">${est.total.toLocaleString()}</span> 원
                                </div>
                            </div>
                        </details>
                    `;
                });

                card.innerHTML = `
                    <input type="text" class="hall-title" placeholder="웨딩홀 이름을 입력하세요" value="${hall.name}" oninput="updateData('${hall.id}', 'name', this.value)">
                    
                    <div class="section-title">⏱ 예식 스케쥴 (타임라인)</div>
                    <div class="input-group">
                        <label>하객 접대 시간</label>
                        <input type="text" placeholder="예: 11:30 ~ 12:30 (식전 1시간)" value="${hall.sch_reception || ''}" oninput="updateData('${hall.id}', 'sch_reception', this.value)">
                    </div>
                    <div class="input-group">
                        <label>식 진행 시간</label>
                        <input type="text" placeholder="예: 12:30 ~ 13:00" value="${hall.sch_ceremony || ''}" oninput="updateData('${hall.id}', 'sch_ceremony', this.value)">
                    </div>
                    <div class="input-group">
                        <label>사진 촬영 (원판)</label>
                        <input type="text" placeholder="예: 13:00 ~ 13:30" value="${hall.sch_photo || ''}" oninput="updateData('${hall.id}', 'sch_photo', this.value)">
                    </div>
                    <div class="input-group">
                        <label>연회장 식사 시간</label>
                        <input type="text" placeholder="예: 12:00 ~ 14:30" value="${hall.sch_meal || ''}" oninput="updateData('${hall.id}', 'sch_meal', this.value)">
                    </div>

                    <div class="section-title">💰 견적 및 혜택 (시간대별)</div>
                    ${estimatesHtml}
                    <button class="btn btn-outline" style="margin-bottom:20px;" onclick="addEstimate('${hall.id}')">+ 이 웨딩홀의 다른 시간대 견적 추가</button>

                    <div class="section-title">📝 상세 체크리스트 요약</div>
                    <div class="input-group">
                        <label>위치 / 교통 / 주차</label>
                        <input type="text" value="${hall.location || ''}" oninput="updateData('${hall.id}', 'location', this.value)" placeholder="예: 강남역 도보 5분, 주차 500대">
                    </div>
                    <div class="input-group">
                        <label>홀 분위기 / 층고 / 버진로드</label>
                        <input type="text" value="${hall.vibe || ''}" oninput="updateData('${hall.id}', 'vibe', this.value)" placeholder="예: 어두운 컨벤션, 층고 높음">
                    </div>
                    <div class="input-group">
                        <label>식사 종류 및 퀄리티</label>
                        <input type="text" value="${hall.meal_type || ''}" oninput="updateData('${hall.id}', 'meal_type', this.value)" placeholder="예: 뷔페 120가지, 연회장 같은층">
                    </div>

                    <button class="btn btn-danger" onclick="deleteHall('${hall.id}')">이 웨딩홀 삭제하기</button>
                `;
                app.appendChild(card);
            });
        }

        // 최초 실행 시 렌더링
        window.onload = render;
    </script>
</body>
</html>
