<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>웨딩홀 투어 체크리스트</title>
    <script src="https://unpkg.com/react@17/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@17/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/babel-standalone@6/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background-color: #f3f4f6; }
        .input-field { width: 100%; padding: 0.5rem; border-radius: 0.375rem; border: 1px solid #d1d5db; margin-top: 0.25rem; font-size: 16px; }
        .checkbox-label { display: flex; align-items: center; space-x: 0.5rem; padding-top: 0.5rem; padding-bottom: 0.5rem; }
        .checkbox-input { width: 1.25rem; height: 1.25rem; margin-right: 0.5rem; }
    </style>
</head>
<body>
    <div id="root"></div>
    <script type="text/babel">
        const { useState, useEffect } = React;

        const initialHallData = {
            id: Date.now(),
            name: '',
            tourDate: '',
            // 1. 기본/교통/주차
            subway: '',
            parkingCapacity: '',
            parkingFee: '',
            atmInfo: '',
            // 2. 홀 컨디션
            hallType: '', // 어두운홀/밝은홀
            ceilingHeight: '',
            seatCount: '',
            bridalRoom: '', // 동선, 화장실 여부
            // 3. 식사
            foodType: '', // 뷔페/코스/한상차림
            diningRoomCapacity: '',
            tastingReview: '',
            // 4. 견적 (비용)
            guarantee: '', // 보증인원
            rentalFee: '', // 대관료
            foodPrice: '', // 식대
            totalEstimate: '', // 총 견적
            perks: '', // 당일 혜택 등
            // 5. 총평
            rating: 3,
            notes: ''
        };

        function App() {
            const [halls, setHalls] = useState([]);
            const [currentView, setCurrentView] = useState('list'); // 'list' or 'detail'
            const [activeHall, setActiveHall] = useState(null);

            // 로컬 스토리지에서 데이터 불러오기
            useEffect(() => {
                const savedData = localStorage.getItem('weddingHalls');
                if (savedData) {
                    setHalls(JSON.parse(savedData));
                }
            }, []);

            // 데이터 저장하기
            const saveToLocal = (data) => {
                localStorage.setItem('weddingHalls', JSON.stringify(data));
            };

            const handleAddHall = () => {
                const newHall = { ...initialHallData, id: Date.now() };
                setActiveHall(newHall);
                setCurrentView('detail');
            };

            const handleEditHall = (hall) => {
                setActiveHall(hall);
                setCurrentView('detail');
            };

            const handleDelete = (id) => {
                if(window.confirm('정말 삭제하시겠습니까?')) {
                    const updatedHalls = halls.filter(h => h.id !== id);
                    setHalls(updatedHalls);
                    saveToLocal(updatedHalls);
                }
            };

            const handleChange = (e) => {
                const { name, value, type, checked } = e.target;
                setActiveHall({
                    ...activeHall,
                    [name]: type === 'checkbox' ? checked : value
                });
            };

            const handleSave = () => {
                if(!activeHall.name) {
                    alert('웨딩홀 이름을 입력해주세요.');
                    return;
                }
                
                let updatedHalls;
                const exists = halls.find(h => h.id === activeHall.id);
                if (exists) {
                    updatedHalls = halls.map(h => h.id === activeHall.id ? activeHall : h);
                } else {
                    updatedHalls = [...halls, activeHall];
                }
                
                setHalls(updatedHalls);
                saveToLocal(updatedHalls);
                setCurrentView('list');
            };

            if (currentView === 'list') {
                return (
                    <div className="max-w-md mx-auto min-h-screen bg-gray-50 pb-20">
                        <header className="bg-pink-500 text-white p-4 sticky top-0 z-10 shadow-md">
                            <h1 className="text-xl font-bold text-center">우리의 웨딩홀 투어 💍</h1>
                        </header>
                        
                        <div className="p-4 space-y-4">
                            {halls.length === 0 ? (
                                <div className="text-center text-gray-500 py-10">
                                    <p>아직 등록된 웨딩홀이 없습니다.</p>
                                    <p>아래 버튼을 눌러 투어 기록을 시작하세요!</p>
                                </div>
                            ) : (
                                halls.map(hall => (
                                    <div key={hall.id} className="bg-white p-4 rounded-xl shadow border border-gray-100">
                                        <div className="flex justify-between items-center mb-2">
                                            <h2 className="text-lg font-bold text-gray-800">{hall.name}</h2>
                                            <span className="text-sm text-pink-500 font-semibold">{hall.rating}점</span>
                                        </div>
                                        <div className="text-sm text-gray-600 mb-4 space-y-1">
                                            <p>📅 {hall.tourDate || '날짜 미지정'}</p>
                                            <p>💰 총 견적: {hall.totalEstimate ? Number(hall.totalEstimate).toLocaleString() + '원' : '미입력'}</p>
                                        </div>
                                        <div className="flex space-x-2">
                                            <button onClick={() => handleEditHall(hall)} className="flex-1 bg-gray-100 text-gray-700 py-2 rounded-lg font-medium">수정/보기</button>
                                            <button onClick={() => handleDelete(hall.id)} className="px-4 bg-red-50 text-red-500 py-2 rounded-lg font-medium">삭제</button>
                                        </div>
                                    </div>
                                ))
                            )}
                        </div>

                        <button 
                            onClick={handleAddHall}
                            className="fixed bottom-6 right-6 w-14 h-14 bg-pink-500 text-white rounded-full shadow-lg text-3xl flex items-center justify-center hover:bg-pink-600 transition"
                        >
                            +
                        </button>
                    </div>
                );
            }

            return (
                <div className="max-w-md mx-auto min-h-screen bg-white">
                    <header className="bg-pink-500 text-white p-4 sticky top-0 z-10 shadow-md flex justify-between items-center">
                        <button onClick={() => setCurrentView('list')} className="font-bold">← 뒤로</button>
                        <h1 className="text-lg font-bold">{activeHall.name ? activeHall.name : '새 웨딩홀 기록'}</h1>
                        <button onClick={handleSave} className="font-bold">저장</button>
                    </header>

                    <div className="p-4 space-y-6">
                        {/* 기본 정보 */}
                        <section>
                            <h3 className="text-pink-600 font-bold border-b border-pink-100 pb-2 mb-3">📌 기본 정보</h3>
                            <div>
                                <label className="block text-sm font-medium text-gray-700">웨딩홀 이름 *</label>
                                <input type="text" name="name" value={activeHall.name} onChange={handleChange} className="input-field" placeholder="예: 더채플앳논현" />
                            </div>
                            <div className="mt-3">
                                <label className="block text-sm font-medium text-gray-700">투어 날짜</label>
                                <input type="date" name="tourDate" value={activeHall.tourDate} onChange={handleChange} className="input-field" />
                            </div>
                        </section>

                        {/* 위치 및 주차 */}
                        <section>
                            <h3 className="text-pink-600 font-bold border-b border-pink-100 pb-2 mb-3">🚗 위치 & 주차</h3>
                            <div className="space-y-3">
                                <div>
                                    <label className="block text-sm font-medium text-gray-700">대중교통 접근성</label>
                                    <input type="text" name="subway" value={activeHall.subway} onChange={handleChange} className="input-field" placeholder="예: 9호선 언주역 도보 5분" />
                                </div>
                                <div>
                                    <label className="block text-sm font-medium text-gray-700">주차 대수 및 시간</label>
                                    <input type="text" name="parkingCapacity" value={activeHall.parkingCapacity} onChange={handleChange} className="input-field" placeholder="예: 500대 / 하객 2시간 무료" />
                                </div>
                                <div>
                                    <label className="block text-sm font-medium text-gray-700">발렛/ATM 등 편의시설</label>
                                    <input type="text" name="atmInfo" value={activeHall.atmInfo} onChange={handleChange} className="input-field" placeholder="예: 1층에 ATM 있음" />
                                </div>
                            </div>
                        </section>

                        {/* 홀 컨디션 */}
                        <section>
                            <h3 className="text-pink-600 font-bold border-b border-pink-100 pb-2 mb-3">✨ 홀 분위기 & 동선</h3>
                            <div className="space-y-3">
                                <div>
                                    <label className="block text-sm font-medium text-gray-700">홀 느낌</label>
                                    <input type="text" name="hallType" value={activeHall.hallType} onChange={handleChange} className="input-field" placeholder="예: 어두운 컨벤션, 채플, 하우스" />
                                </div>
                                <div>
                                    <label className="block text-sm font-medium text-gray-700">천고 / 좌석 수</label>
                                    <input type="text" name="seatCount" value={activeHall.seatCount} onChange={handleChange} className="input-field" placeholder="예: 천고 높음 / 200석" />
                                </div>
                                <div>
                                    <label className="block text-sm font-medium text-gray-700">신부대기실 (화장실, 동선)</label>
                                    <input type="text" name="bridalRoom" value={activeHall.bridalRoom} onChange={handleChange} className="input-field" placeholder="예: 화장실 있음, 홀과 바로 연결" />
                                </div>
                            </div>
                        </section>

                        {/* 식사 */}
                        <section>
                            <h3 className="text-pink-600 font-bold border-b border-pink-100 pb-2 mb-3">🍽️ 식사 (연회장)</h3>
                            <div className="space-y-3">
                                <div>
                                    <label className="block text-sm font-medium text-gray-700">식사 종류</label>
                                    <input type="text" name="foodType" value={activeHall.foodType} onChange={handleChange} className="input-field" placeholder="예: 뷔페 120종" />
                                </div>
                                <div>
                                    <label className="block text-sm font-medium text-gray-700">연회장 크기 및 이용시간</label>
                                    <input type="text" name="diningRoomCapacity" value={activeHall.diningRoomCapacity} onChange={handleChange} className="input-field" placeholder="예: 700석 / 2시간" />
                                </div>
                            </div>
                        </section>

                        {/* 견적 */}
                        <section>
                            <h3 className="text-pink-600 font-bold border-b border-pink-100 pb-2 mb-3">💰 견적 (비용)</h3>
                            <div className="space-y-3">
                                <div>
                                    <label className="block text-sm font-medium text-gray-700">보증 인원</label>
                                    <input type="number" name="guarantee" value={activeHall.guarantee} onChange={handleChange} className="input-field" placeholder="예: 250" />
                                </div>
                                <div>
                                    <label className="block text-sm font-medium text-gray-700">식대 (할인가 기준)</label>
                                    <input type="number" name="foodPrice" value={activeHall.foodPrice} onChange={handleChange} className="input-field" placeholder="숫자만 입력 (예: 65000)" />
                                </div>
                                <div>
                                    <label className="block text-sm font-medium text-gray-700">대관료 (생화장출 등 포함)</label>
                                    <input type="number" name="rentalFee" value={activeHall.rentalFee} onChange={handleChange} className="input-field" placeholder="숫자만 입력 (예: 3000000)" />
                                </div>
                                <div className="bg-pink-50 p-3 rounded-lg border border-pink-200">
                                    <label className="block text-sm font-bold text-pink-700">최종 견적 (대략)</label>
                                    <input type="number" name="totalEstimate" value={activeHall.totalEstimate} onChange={handleChange} className="input-field bg-white" placeholder="자동계산 또는 직접입력" />
                                    <p className="text-xs text-gray-500 mt-1">* 참고: (보증인원 x 식대) + 대관료 = {(activeHall.guarantee * activeHall.foodPrice) + Number(activeHall.rentalFee)}원</p>
                                </div>
                                <div>
                                    <label className="block text-sm font-medium text-gray-700">당일 혜택 및 특이사항</label>
                                    <textarea name="perks" value={activeHall.perks} onChange={handleChange} className="input-field" rows="2" placeholder="예: 당일 계약 시 식대 2천원 할인, 전문 사회자 서비스"></textarea>
                                </div>
                            </div>
                        </section>

                        {/* 총평 */}
                        <section className="pb-10">
                            <h3 className="text-pink-600 font-bold border-b border-pink-100 pb-2 mb-3">📝 총평</h3>
                            <div className="space-y-3">
                                <div>
                                    <label className="block text-sm font-medium text-gray-700">내 마음속 평점 (1~5)</label>
                                    <input type="number" name="rating" min="1" max="5" value={activeHall.rating} onChange={handleChange} className="input-field" />
                                </div>
                                <div>
                                    <label className="block text-sm font-medium text-gray-700">개인적인 장단점 / 메모</label>
                                    <textarea name="notes" value={activeHall.notes} onChange={handleChange} className="input-field" rows="4" placeholder="예: 홀은 예쁜데 주차가 헬이다. 밥은 맛있어보임."></textarea>
                                </div>
                            </div>
                        </section>
                    </div>
                </div>
            );
        }

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
